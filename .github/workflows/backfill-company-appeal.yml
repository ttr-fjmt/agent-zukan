name: Backfill companyAppeal (one-off)

# 一回限りのバックフィル用ワークフロー。companyAppeal未設定の全エントリを
# AIで再構造化する（scraper/backfill-company-appeal.js）。
# 手動トリガーのみ（スケジュール実行なし）。実行完了後はこのワークフローファイルと
# scraper/backfill-company-appeal.js を削除して構わない。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci

      - name: Backfill companyAppeal via Claude Haiku 4.5
        working-directory: scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node backfill-company-appeal.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agents.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: backfill companyAppeal for existing agents"

          max_retries=2
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$max_retries" ]; then
              echo "::error::push failed after $max_retries retries"
              exit 1
            fi
            echo "push failed (attempt $attempt/$max_retries) — pulling --rebase and retrying..."
            git pull --rebase origin main
          done
