name: Import A8 affiliate agents

on:
  workflow_dispatch:
    # data/a8-import/アフィリエイト案件_転職エージェント図鑑.xlsx を固定で読み込む
    # 運用のため、ファイルパスの入力は不要（都度この同じファイル名で上書き更新する）。

permissions:
  contents: write

concurrency:
  # agents.json / agent/*/index.html / sitemap.xml / data/ssg-manifest.json をコミット・pushする
  # 全ワークフロー（scrape-agents.yml / import-a8.yml / 今後追加されるもの）で共通のグループ名にし、
  # ワークフローファイルが違っても互いに排他制御されるようにする（同時実行によるコンフリクト防止）。
  group: repo-content-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Cache Puppeteer's bundled Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chromium-${{ runner.os }}-${{ hashFiles('scraper/package-lock.json') }}

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci

      - name: Import A8 affiliate agents into agents.json via Claude Haiku 4.5
        working-directory: scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node import-a8.js

      - name: Install Chrome runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0 libatk1.0-0 \
            libcups2 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 \
            libpango-1.0-0 libpangocairo-1.0-0 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 xdg-utils

      - name: Prerender new/updated agent detail pages (static SSG via Puppeteer)
        working-directory: scraper
        run: node prerender.js

      - name: Generate category landing pages (SEO/AEO)
        working-directory: scraper
        run: node generate-category-pages.js

      - name: Regenerate sitemap.xml
        working-directory: scraper
        run: node generate-sitemap.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agents.json categories.json sitemap.xml data/a8-import/
          # 50,000URL超過時にsitemapが分割された場合のみ生成される
          git add sitemap-*.xml 2>/dev/null || true
          [ -f data/ssg-manifest.json ] && git add data/ssg-manifest.json
          [ -d agent ] && git add agent
          [ -d category ] && git add category
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: import A8 affiliate agents from アフィリエイト案件_転職エージェント図鑑.xlsx"

          max_retries=2
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$max_retries" ]; then
              echo "::error::push failed after $max_retries retries"
              exit 1
            fi
            echo "push failed (attempt $attempt/$max_retries) — pulling --rebase and retrying..."
            git pull --rebase origin main
          done
